<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="An interactive 3D course on IPv4 and IPv6 subnetting: address anatomy, CIDR, VLSM, summarization, and production network design." />
    <title>Subnetting in 3D — Learn Network Subnetting</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('lns-theme')
        var dark = stored === 'dark'
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
